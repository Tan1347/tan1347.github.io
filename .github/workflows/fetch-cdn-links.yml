name: Deploy to GitHub Pages

on:
  schedule:
    - cron: '0 21 * * *'   # 每周一 5:00 AM UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch CDN links
        run: python fetch_cdn_links.py

      - name: Remove workflow files from deploy
        run: |
          rm -rf .github

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Purge Cloudflare Cache
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://speedtest.2026524.xyz/cdn-links.json"]}'

  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: write
      deployments: write

    steps:
      - name: Cleanup old deployments (keep 3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching deployments..."
          DEPLOY_IDS=$(gh api repos/${{ github.repository }}/deployments --paginate -q '.[].id')
          KEEP=3
          COUNT=0
          for id in $DEPLOY_IDS; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt $KEEP ]; then
              echo "Deleting deployment $id..."
              gh api repos/${{ github.repository }}/deployments/$id -X DELETE 2>/dev/null || true
            fi
          done
          echo "Cleanup complete. Kept $KEEP deployments."

      - name: Cleanup old workflow runs (keep 3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching workflow runs..."
          RUN_IDS=$(gh api repos/${{ github.repository }}/actions/runs?per_page=100 -q '.workflow_runs[].id')
          KEEP=3
          COUNT=0
          for id in $RUN_IDS; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt $KEEP ]; then
              echo "Deleting workflow run $id..."
              gh api repos/${{ github.repository }}/actions/runs/$id -X DELETE 2>/dev/null || true
            fi
          done
          echo "Cleanup complete. Kept $KEEP workflow runs."
